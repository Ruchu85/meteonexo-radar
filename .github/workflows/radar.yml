name: Radar OPERA
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: radar
  cancel-in-progress: false
env:
  RADAR_PUBLIC_BASE_URL: https://ruchu85.github.io/meteonexo-radar
  RADAR_DATA_DIR: ${{ github.workspace }}/data
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests del procesador
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests -v
      # Previous frames are reused so each run only downloads the new HDF5 composites.
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-${{ github.run_id }}
          restore-keys: radar-
      - name: Procesar OPERA
        run: python worker.py --history 60 --max-frames 7
      # Forecast maps: only does work when DWD has published a new complete ICON-EU run.
      # A failure here never blocks the radar publication.
      - name: Pronostico ICON-EU
        continue-on-error: true
        timeout-minutes: 9
        run: python model.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: radar-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python scripts/build_site.py data site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
  # Primary trigger. GitHub scheduled workflows are unreliable on young repos (the first
  # cron never fired in 80 minutes), so every run schedules the next one itself.
  # workflow_dispatch started with GITHUB_TOKEN is allowed to start new runs.
  next:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Esperar al siguiente hueco y encadenar
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Next slot at minute ≡ 8 (mod 10): OPERA composites are available ~5 min after
          # their nominal time, and the worker starts fetching ~1 min after the run begins.
          now=$(date -u +%s); minute=$(( (now / 60) % 10 ))
          wait=$(( ((8 - minute + 10) % 10) * 60 - now % 60 ))
          [ "$wait" -lt 30 ] && wait=$((wait + 600))
          echo "Esperando ${wait}s"; sleep "$wait"
          # A backup cron run may already be queued: it becomes the next link, avoiding duplicate chains.
          others=$(gh api "repos/$REPO/actions/workflows/radar.yml/runs?per_page=30"             -q "[.workflow_runs[] | select(.id != $RUN_ID and (.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\"))] | length")
          if [ "$others" != "0" ]; then echo "Ya hay $others ejecuciones en cola; no se duplica"; exit 0; fi
          # The GitHub API sometimes answers 5xx; a lost dispatch would stop the whole chain.
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run radar.yml -R "$REPO" --ref main; then echo "Siguiente ciclo lanzado"; exit 0; fi
            echo "Intento $attempt fallido; reintentando"; sleep $((attempt * 15))
          done
          exit 1
